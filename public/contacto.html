<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Josefina Muro</title>
  <meta name="description" content="Contame qué necesitás y te respondo por mail.">
  <link rel="icon" href="imagenes/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
  <script src="comun.js"></script>
</head>
<body>
  <div class="brillos" id="brillos" aria-hidden="true"></div>

  <header class="cabecera">
    <a href="index.html" class="logo-enlace" aria-label="Josefina Muro, diseño web. Ir al inicio">
      <img class="logo" src="imagenes/logo.png" alt="Josefina Muro – Diseño web" width="451" height="218">
    </a>
    <button class="tema" id="botonTema" type="button" aria-pressed="false" aria-label="Cambiar a tema oscuro" title="Cambiar tema">
      <svg class="i-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <span class="tema-bola" aria-hidden="true"></span>
    </button>
  </header>

  <nav class="nav" aria-label="Principal">
    <ul>
      <li><a href="index.html#trabajos">TRABAJOS</a></li>
      <li><a href="index.html#sobre-mi">SOBRE MÍ</a></li>
      <li><a href="contacto.html" aria-current="page">CONTACTO</a></li>
    </ul>
  </nav>

  <main class="principal-contacto">
    <section class="contenedor-form">
      <h1 class="titulo-centro">Contame qué necesitás</h1>
      <p class="subtitulo-centro">Te respondo por mail. Todos los campos son obligatorios.</p>

      <form id="formulario" class="formulario" novalidate>
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" type="text" maxlength="120" autocomplete="name" placeholder="Tu nombre" required>
        </div>
        <div class="campo">
          <label for="mail">Mail</label>
          <input id="mail" name="mail" type="email" maxlength="120" autocomplete="email" placeholder="tucorreo@ejemplo.com" required>
        </div>
        <div class="campo">
          <label for="celular">Celular</label>
          <input id="celular" name="celular" type="tel" inputmode="tel" maxlength="20" autocomplete="tel" placeholder="Ej: 2342 411326" required>
        </div>
        <div class="campo">
          <label for="consulta">Consulta</label>
          <textarea id="consulta" name="consulta" rows="5" maxlength="200" placeholder="Contame brevemente qué necesitás" required></textarea>
          <span class="contador" id="contador">0 / 200</span>
        </div>
        <!-- trampa para robots: las personas no lo ven -->
        <div class="trampa" aria-hidden="true"><label>No completar <input type="text" name="web" tabindex="-1" autocomplete="off"></label></div>

        <p class="aviso" id="aviso" role="status" aria-live="polite"></p>

        <div class="botones">
          <button type="submit" class="boton-principal" id="botonEnviar">Enviar</button>
          <button type="reset" class="boton-secundario">Borrar formulario</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="pie">
    <div class="redes">
      <a class="red" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><img src="imagenes/instagram.svg" alt=""></a>
      <a class="red" href="mailto:tucorreo@gmail.com" aria-label="Enviar un mail"><img src="imagenes/gmail.svg" alt=""></a>
      <a class="red" href="https://wa.me/5492342411326" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"><img src="imagenes/whatsapp.svg" alt=""></a>
    </div>
    <small>© 2026 Josefina Muro · Diseño web</small>
  </footer>

  <script src="contacto.js"></script>
</body>
</html>
